<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Comunicaciones Alessandro</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e9f6ff, #ffffff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(18, 59, 93, 0.15);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            color: #123b5d;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #6b7c8a;
            font-size: 14px;
        }

        h2 {
            color: #123b5d;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #263746;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dce8ef;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #36a9e1;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #0878b9;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #123b5d;
        }

        .registro {
            text-align: center;
            margin-top: 20px;
            color: #6b7c8a;
            font-size: 14px;
        }

        .registro a {
            color: #0878b9;
            text-decoration: none;
            font-weight: bold;
        }

        .registro a:hover {
            text-decoration: underline;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #6b7c8a;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <h1>Comunicaciones Alessandro</h1>
            <p>Tecnología a tu alcance</p>
        </div>

        <h2>Iniciar sesión</h2>

        <form id="loginForm">

            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    placeholder="Ingresa tu correo"
                    required
                >
            </div>

            <div class="form-group">
                <label for="contraseña">Contraseña</label>
                <input
                    type="password"
                    id="contraseña"
                    placeholder="Ingresa tu contraseña"
                    required
                >
            </div>

            <button type="submit">Iniciar sesión</button>

        </form>

        <div class="registro">
            ¿No tienes una cuenta?
            <a href="registro.html">Crear cuenta</a>
        </div>

        <a href="index.html" class="volver">← Volver a la tienda</a>

    </div>

    <script type="module" src="auth.js"></script>

</body>
</html>
